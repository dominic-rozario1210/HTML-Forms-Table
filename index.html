<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form and Table</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <form>
        <h1>Student Registration Form</h1>

        <label for="">Full Name:</label><br>
        <input type="text" name="" id="" placeholder="Enter Your Name">
        <br><br>

        <label for="">Email:</label><br>
        <input type="email" placeholder="Enter Your Email">
        <br><br>

        <label for="">Password:</label><br>
        <input type="password" placeholder="Enter Your Password">
        <br><br>

        <label for="">Gender:</label><br>
        <label for="Male"><input type="radio" name="Gender" id="Male">Male</label>
        <label for="Female"><input type="radio" name="Gender" id="Female">Female</label>
        <br><br>

        <label for="">Skills:</label><br>
        <label for=""><input type="checkbox" name="skills">HTML</label>
        <label for=""><input type="checkbox" name="skills">Css</label>
        <label for=""><input type="checkbox" name="skills">JavaScript</label>
        <br><br>

        <label for="">Date Of Birth</label><br>
        <input type="date" name="" id="">
        <br><br>

        <button type="submit">Submit</button>
    </form>


    <hr>

    <h1>Submitted Students</h1>
    <table border="1" CellPadding="8">
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Gender</th>
            <th>Skill</th>
            <th>DOB</th>
        </tr>
        <tr>
            <td>Alice</td>
            <td>alice@example.com</td>
            <td>Female</td>
            <td>HTML,CSS</td>
            <td>2002-05-10</td>
        </tr>
        <tr>
            <td>Bob</td>
            <td>bob@example.com</td>
            <td>Male</td>
            <td>JavaScript</td>
            <td>2001-11-22</td>
        </tr>


    </table>


</body>

</html>
